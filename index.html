

<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>	
    <a-scene mindar-image="imageTargetSrc: ./multiMarker.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <a-asset-item id="appleModel" src="./apple.glb"></a-asset-item>
	<a-asset-item id="peachModel" src="./peach.glb"></a-asset-item>
        <a-asset-item id="pumpkinModel" src="./pumpkin.glb"></a-asset-item>
	<a-asset-item id="tomatoModel" src="./tomato.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster=" far: 100; objects: .clickable" ></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model id="apple-model" class="clickable" rotation="0 0 0 " position="0 0 0" scale="0.003 0.003 0.005" src="#appleModel" animation-mixer></a-gltf-model>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model id="pumpkin-model" class="clickable" rotation="0 0 0 " position="0 0 0" scale="0.005 0.005 0.005" src="#pumpkinModel" animation-mixer></a-gltf-model>
      </a-entity>
    </a-scene>
	<script>
	const appleModel = document.querySelector('#apple-model'); appleModel.addEventListener('click', () => { appleModel.setAttribute('src', '#peachModel'); });
	const pumpkinModel = document.querySelector('#pumpkin-model'); pumpkinModel.addEventListener('click', () => { pumpkinModel.setAttribute('src', '#tomatoModel'); }); 
	</script>
  </body>
</html>
